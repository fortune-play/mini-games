<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のナンプレ 第1弾｜ふぉーちゅん</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 10px;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  background: #f7f7f7;
  color: #333;
}

.game-wrap {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 22px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h1 {
  margin: 0 0 8px;
  text-align: center;
  font-size: 25px;
  color: #333;
}

.subtitle {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-bottom: 18px;
}

.info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  font-size: 14px;
}

.timer {
  font-weight: bold;
}

.message {
  min-height: 24px;
  text-align: center;
  font-weight: bold;
  margin: 12px 0;
}

.board {
  width: min(100%, 450px);
  aspect-ratio: 1 / 1;
  margin: 0 auto 18px;
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  border: 3px solid #333;
  background: #333;
}

.cell {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #fff;
  border-right: 1px solid #aaa;
  border-bottom: 1px solid #aaa;
  font-size: clamp(20px, 6vw, 32px);
  font-weight: 500;
  cursor: pointer;
  user-select: none;
}

.cell:nth-child(3n) {
  border-right: 2px solid #333;
}

.cell:nth-child(9n) {
  border-right: none;
}

.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
  border-bottom: 2px solid #333;
}

.cell:nth-child(n+73) {
  border-bottom: none;
}

.cell.fixed {
  background: #f1f1f1;
  font-weight: bold;
  cursor: default;
}

.cell.selected {
  background: #eaf3ff;
}

.cell.same-number {
  background: #f4f8ff;
}

.cell.error {
  background: #ffe6e6;
  color: #c62828;
}

.cell.correct {
  color: #1565c0;
}

.number-pad {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  max-width: 450px;
  margin: 0 auto 14px;
}

.number-btn,
.control-btn {
  border: none;
  border-radius: 8px;
  padding: 12px 6px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  background: #eee;
  color: #333;
}

.number-btn:hover,
.control-btn:hover {
  background: #ddd;
}

.number-btn:active,
.control-btn:active {
  transform: translateY(1px);
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  max-width: 450px;
  margin: 0 auto;
}

.reset {
  background: #333;
  color: #fff;
}

.reset:hover {
  background: #555;
}

.rules {
  margin-top: 22px;
  padding-top: 15px;
  border-top: 1px solid #ddd;
  font-size: 13px;
  line-height: 1.7;
  color: #666;
}

@media (max-width: 480px) {
  .game-wrap {
    padding: 15px;
  }

  h1 {
    font-size: 21px;
  }

  .number-btn,
  .control-btn {
    padding: 10px 4px;
    font-size: 16px;
  }
}
</style>
</head>

<body>

<div class="game-wrap">

  <h1>今日のナンプレ 第1弾</h1>

  <div class="subtitle">
    ふぉーちゅんの5〜10分ミニゲーム
  </div>

  <div class="info">
    <div>難易度：かんたん</div>
    <div class="timer">時間：<span id="timer">00:00</span></div>
  </div>

  <div id="message" class="message"></div>

  <div id="board" class="board"></div>

  <div class="number-pad">
    <button class="number-btn" data-number="1">1</button>
    <button class="number-btn" data-number="2">2</button>
    <button class="number-btn" data-number="3">3</button>
    <button class="number-btn" data-number="4">4</button>
    <button class="number-btn" data-number="5">5</button>
    <button class="number-btn" data-number="6">6</button>
    <button class="number-btn" data-number="7">7</button>
    <button class="number-btn" data-number="8">8</button>
    <button class="number-btn" data-number="9">9</button>
    <button class="number-btn" data-number="0">消す</button>
  </div>

  <div class="controls">
    <button class="control-btn" id="checkBtn">答え合わせ</button>
    <button class="control-btn reset" id="resetBtn">最初から</button>
  </div>

  <div class="rules">
    <strong>遊び方</strong><br>
    ① 空いているマスをクリック<br>
    ② 下の数字から入れたい数字を選択<br>
    ③ 縦・横・3×3のマスに同じ数字が入らないように完成させよう！<br>
    ④ 「答え合わせ」でチェックできます。
  </div>

</div>

<script>
const puzzle = [
  [5,3,0,0,7,0,0,0,0],
  [6,0,0,1,9,5,0,0,0],
  [0,9,8,0,0,0,0,6,0],
  [8,0,0,0,6,0,0,0,3],
  [4,0,0,8,0,3,0,0,1],
  [7,0,0,0,2,0,0,0,6],
  [0,6,0,0,0,0,2,8,0],
  [0,0,0,4,1,9,0,0,5],
  [0,0,0,0,8,0,0,7,9]
];

const solution = [
  [5,3,4,6,7,8,9,1,2],
  [6,7,2,1,9,5,3,4,8],
  [1,9,8,3,4,2,5,6,7],
  [8,5,9,7,6,1,4,2,3],
  [4,2,6,8,5,3,7,9,1],
  [7,1,3,9,2,4,8,5,6],
  [9,6,1,5,3,7,2,8,4],
  [2,8,7,4,1,9,6,3,5],
  [3,4,5,2,8,6,1,7,9]
];

let board = puzzle.map(row => [...row]);
let selectedCell = null;
let seconds = 0;
let timerInterval = null;
let gameStarted = false;

const boardElement = document.getElementById("board");
const timerElement = document.getElementById("timer");
const messageElement = document.getElementById("message");

function createBoard() {
  boardElement.innerHTML = "";

  for (let row = 0; row < 9; row++) {
    for (let col = 0; col < 9; col++) {

      const cell = document.createElement("div");
      cell.className = "cell";

      const value = board[row][col];

      if (puzzle[row][col] !== 0) {
        cell.textContent = value;
        cell.classList.add("fixed");
      } else if (value !== 0) {
        cell.textContent = value;
        cell.classList.add("correct");
      }

      cell.dataset.row = row;
      cell.dataset.col = col;

      cell.addEventListener("click", () => {
        if (puzzle[row][col] !== 0) return;

        selectedCell = { row, col };
        highlightCells(row, col);
      });

      boardElement.appendChild(cell);
    }
  }

  if (selectedCell) {
    highlightCells(selectedCell.row, selectedCell.col);
  }
}

function highlightCells(row, col) {
  const cells = document.querySelectorAll(".cell");

  cells.forEach(cell => {
    cell.classList.remove("selected");
    cell.classList.remove("same-number");

    const r = Number(cell.dataset.row);
    const c = Number(cell.dataset.col);

    if (r === row && c === col) {
      cell.classList.add("selected");
    }
  });

  const value = board[row][col];

  if (value !== 0) {
    cells.forEach(cell => {
      const r = Number(cell.dataset.row);
      const c = Number(cell.dataset.col);

      if (board[r][c] === value) {
        cell.classList.add("same-number");
      }
    });
  }
}

function startTimer() {
  if (gameStarted) return;

  gameStarted = true;

  timerInterval = setInterval(() => {
    seconds++;

    const min = String(Math.floor(seconds / 60)).padStart(2, "0");
    const sec = String(seconds % 60).padStart(2, "0");

    timerElement.textContent = `${min}:${sec}`;
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function inputNumber(number) {

  if (!selectedCell) {
    messageElement.textContent = "まず、入れたいマスを選んでください。";
    return;
  }

  startTimer();

  const { row, col } = selectedCell;

  if (puzzle[row][col] !== 0) return;

  if (number === 0) {
    board[row][col] = 0;
  } else {
    board[row][col] = number;
  }

  messageElement.textContent = "";
  createBoard();
}

function checkAnswer() {

  let empty = false;
  let wrong = false;

  for (let row = 0; row < 9; row++) {
    for (let col = 0; col < 9; col++) {

      if (board[row][col] === 0) {
        empty = true;
      } else if (board[row][col] !== solution[row][col]) {
        wrong = true;
      }
    }
  }

  if (wrong) {
    messageElement.textContent = "まだ間違っているマスがあります。";
    messageElement.style.color = "#c62828";
    return;
  }

  if (empty) {
    messageElement.textContent = "まだ空いているマスがあります。";
    messageElement.style.color = "#d97706";
    return;
  }

  stopTimer();

  messageElement.textContent =
    `🎉 クリア！ おめでとうございます！ タイム ${timerElement.textContent}`;

  messageElement.style.color = "#16803c";
}

function resetGame() {

  stopTimer();

  board = puzzle.map(row => [...row]);
  selectedCell = null;
  seconds = 0;
  gameStarted = false;

  timerElement.textContent = "00:00";
  messageElement.textContent = "";
  messageElement.style.color = "";

  createBoard();
}

document.querySelectorAll(".number-btn").forEach(button => {

  button.addEventListener("click", () => {

    const number = Number(button.dataset.number);

    inputNumber(number);
  });

});

document.getElementById("checkBtn").addEventListener("click", checkAnswer);

document.getElementById("resetBtn").addEventListener("click", resetGame);

createBoard();
</script>

</body>
</html>
