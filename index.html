<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のナンプレ 第1弾｜ふぉーちゅん</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 10px;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  background: #f7f7f7;
  color: #333;
}

.game-wrap {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 22px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h1 {
  margin: 0 0 8px;
  text-align: center;
  font-size: 25px;
  color: #333;
}

.subtitle {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-bottom: 18px;
}

.info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
  font-size: 14px;
}

.difficulty-area {
  display: flex;
  align-items: center;
  gap: 6px;
}

#difficulty {
  padding: 6px 8px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: #fff;
  font-size: 14px;
}

.timer {
  font-weight: bold;
  white-space: nowrap;
}

.message {
  min-height: 24px;
  text-align: center;
  font-weight: bold;
  margin: 12px 0;
}

.board {
  width: min(100%, 450px);
  aspect-ratio: 1 / 1;
  margin: 0 auto 18px;
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  border: 3px solid #333;
  background: #333;
}

.cell {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #fff;
  border-right: 1px solid #aaa;
  border-bottom: 1px solid #aaa;
  font-size: clamp(20px, 6vw, 32px);
  font-weight: 500;
  cursor: pointer;
  user-select: none;
}

.cell:nth-child(3n) {
  border-right: 2px solid #333;
}

.cell:nth-child(9n) {
  border-right: none;
}

.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
  border-bottom: 2px solid #333;
}

.cell:nth-child(n+73) {
  border-bottom: none;
}

.cell.fixed {
  background: #f1f1f1;
  font-weight: bold;
  cursor: default;
}

.cell.selected {
  background: #eaf3ff;
}

.cell.same-number {
  background: #f4f8ff;
}

.cell.error {
  background: #ffe6e6;
  color: #c62828;
}

.cell.correct {
  color: #1565c0;
}

.number-pad {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  max-width: 450px;
  margin: 0 auto 14px;
}

.number-btn,
.control-btn {
  border: none;
  border-radius: 8px;
  padding: 12px 6px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  background: #eee;
  color: #333;
}

.number-btn:hover,
.control-btn:hover {
  background: #ddd;
}

.number-btn:active,
.control-btn:active {
  transform: translateY(1px);
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  max-width: 450px;
  margin: 0 auto;
}

.reset {
  background: #333;
  color: #fff;
}

.reset:hover {
  background: #555;
}

.rules {
  margin-top: 22px;
  padding-top: 15px;
  border-top: 1px solid #ddd;
  font-size: 13px;
  line-height: 1.7;
  color: #666;
}

@media (max-width: 480px) {
  .game-wrap {
    padding: 15px;
  }

  h1 {
    font-size: 21px;
  }

  .info {
    align-items: flex-start;
  }

  .difficulty-area {
    flex-direction: column;
    align-items: flex-start;
  }

  .number-btn,
  .control-btn {
    padding: 10px 4px;
    font-size: 16px;
  }
}
</style>
</head>

<body>

<div class="game-wrap">

  <h1>今日のナンプレ 第1弾</h1>

  <div class="subtitle">
    ふぉーちゅんの5〜10分ミニゲーム
  </div>

  <div class="info">

    <div class="difficulty-area">
      <span>レベル：</span>

      <select id="difficulty">
        <option value="beginner">初心者</option>
        <option value="easy">初級</option>
        <option value="medium">中級</option>
        <option value="hard">上級</option>
      </select>
    </div>

    <div class="timer">
      時間：<span id="timer">00:00</span>
    </div>

  </div>

  <div id="message" class="message"></div>

  <div id="board" class="board"></div>

  <div class="number-pad">

    <button class="number-btn" data-number="1">1</button>
    <button class="number-btn" data-number="2">2</button>
    <button class="number-btn" data-number="3">3</button>
    <button class="number-btn" data-number="4">4</button>
    <button class="number-btn" data-number="5">5</button>

    <button class="number-btn" data-number="6">6</button>
    <button class="number-btn" data-number="7">7</button>
    <button class="number-btn" data-number="8">8</button>
    <button class="number-btn" data-number="9">9</button>
    <button class="number-btn" data-number="0">消す</button>

  </div>

  <div class="controls">

    <button class="control-btn" id="checkBtn">
      答え合わせ
    </button>

    <button class="control-btn reset" id="resetBtn">
      最初から
    </button>

  </div>

  <div class="rules">

    <strong>遊び方</strong><br>

    ① 空いているマスをクリック<br>

    ② 下の数字から入れたい数字を選択<br>

    ③ 縦・横・3×3のマスに同じ数字が入らないように完成させよう！<br>

    ④ 「答え合わせ」でチェックできます。

  </div>

</div>

<script>

/* =========================
   ナンプレの答え
========================= */

const solution = [
  [5,3,4,6,7,8,9,1,2],
  [6,7,2,1,9,5,3,4,8],
  [1,9,8,3,4,2,5,6,7],
  [8,5,9,7,6,1,4,2,3],
  [4,2,6,8,5,3,7,9,1],
  [7,1,3,9,2,4,8,5,6],
  [9,6,1,5,3,7,2,8,4],
  [2,8,7,4,1,9,6,3,5],
  [3,4,5,2,8,6,1,7,9]
];


/* =========================
   4段階の問題
========================= */

const puzzles = {

  beginner: [
    [5,3,0,6,0,0,9,0,2],
    [0,0,0,1,9,5,3,0,8],
    [0,0,8,0,0,0,5,0,7],
    [8,5,0,0,0,1,4,2,0],
    [0,2,0,0,0,3,0,9,0],
    [0,1,0,9,2,0,8,0,6],
    [9,6,0,5,0,0,2,0,4],
    [2,8,7,4,0,0,0,0,0],
    [3,4,5,2,0,0,0,7,0]
  ],

  easy: [
    [0,3,0,0,7,0,0,1,0],
    [0,7,2,0,0,5,3,0,0],
    [0,0,8,3,4,2,5,0,0],
    [8,0,9,0,0,1,4,2,3],
    [0,0,0,8,0,0,0,0,0],
    [0,1,3,0,0,4,0,0,6],
    [0,6,1,0,0,0,0,8,0],
    [0,8,7,0,0,0,0,3,5],
    [3,4,0,0,0,0,1,7,0]
  ],

  medium: [
    [5,3,0,0,0,0,0,0,2],
    [6,7,0,0,0,0,0,4,0],
    [0,9,0,0,0,0,5,0,0],
    [0,0,9,7,0,1,4,0,0],
    [0,0,0,0,5,0,7,0,0],
    [0,0,3,0,0,4,0,0,0],
    [0,6,0,0,0,7,2,0,0],
    [0,0,0,0,1,9,6,3,5],
    [0,0,5,2,8,0,1,7,0]
  ],

  hard: [
    [0,3,4,0,0,0,0,1,2],
    [0,0,2,0,9,0,0,0,0],
    [1,9,0,0,0,0,0,0,0],
    [0,5,0,7,0,0,0,0,3],
    [0,2,6,0,0,3,0,0,0],
    [0,1,0,0,0,4,8,5,6],
    [0,6,0,0,0,0,0,8,0],
    [0,0,7,4,0,0,0,3,5],
    [0,0,0,0,0,0,1,0,0]
  ]

};


/* =========================
   状態
========================= */

let currentLevel = "beginner";

let puzzle = puzzles[currentLevel].map(row => [...row]);

let board = puzzle.map(row => [...row]);

let selectedCell = null;

let seconds = 0;

let timerInterval = null;

let gameStarted = false;

let messageTimer = null;


/* =========================
   DOM
========================= */

const boardElement =
  document.getElementById("board");

const timerElement =
  document.getElementById("timer");

const messageElement =
  document.getElementById("message");

const difficultyElement =
  document.getElementById("difficulty");


/* =========================
   メッセージ
========================= */

function showMessage(text, color = "#333", duration = 3000) {

  clearTimeout(messageTimer);

  messageElement.textContent = text;

  messageElement.style.color = color;

  if (duration > 0) {

    messageTimer = setTimeout(() => {

      messageElement.textContent = "";

      messageElement.style.color = "";

    }, duration);

  }

}


/* =========================
   盤面作成
========================= */

function createBoard() {

  boardElement.innerHTML = "";

  for (let row = 0; row < 9; row++) {

    for (let col = 0; col < 9; col++) {

      const cell =
        document.createElement("div");

      cell.className = "cell";

      const value = board[row][col];

      if (puzzle[row][col] !== 0) {

        cell.textContent = value;

        cell.classList.add("fixed");

      } else if (value !== 0) {

        cell.textContent = value;

        cell.classList.add("correct");

      }

      cell.dataset.row = row;

      cell.dataset.col = col;

      cell.addEventListener("click", () => {

        if (puzzle[row][col] !== 0) {
          return;
        }

        selectedCell = {
          row,
          col
        };

        highlightCells(row, col);

        startTimer();

      });

      boardElement.appendChild(cell);

    }

  }

  if (selectedCell) {

    highlightCells(
      selectedCell.row,
      selectedCell.col
    );

  }

}


/* =========================
   選択マス表示
========================= */

function highlightCells(row, col) {

  const cells =
    document.querySelectorAll(".cell");

  cells.forEach(cell => {

    cell.classList.remove("selected");

    cell.classList.remove("same-number");

  });

  const selected =
    document.querySelector(
      `.cell[data-row="${row}"][data-col="${col}"]`
    );

  if (selected) {

    selected.classList.add("selected");

  }

  const value = board[row][col];

  if (value !== 0) {

    cells.forEach(cell => {

      const r =
        Number(cell.dataset.row);

      const c =
        Number(cell.dataset.col);

      if (board[r][c] === value) {

        cell.classList.add("same-number");

      }

    });

  }

}


/* =========================
   タイマー
========================= */

function startTimer() {

  if (gameStarted) {
    return;
  }

  gameStarted = true;

  timerInterval =
    setInterval(() => {

      seconds++;

      const min =
        String(
          Math.floor(seconds / 60)
        ).padStart(2, "0");

      const sec =
        String(
          seconds % 60
        ).padStart(2, "0");

      timerElement.textContent =
        `${min}:${sec}`;

    }, 1000);

}


function stopTimer() {

  if (timerInterval) {

    clearInterval(timerInterval);

    timerInterval = null;

  }

}


/* =========================
   数字入力
========================= */

function inputNumber(number) {

  if (!selectedCell) {

    showMessage(
      "まず空いているマスを選んでください。",
      "#666"
    );

    return;

  }

  const {
    row,
    col
  } = selectedCell;

  if (puzzle[row][col] !== 0) {
    return;
  }

  startTimer();

  board[row][col] = number;

  createBoard();

}


/* =========================
   答え合わせ
========================= */

function checkAnswer() {

  startTimer();

  let emptyCount = 0;

  let wrongCount = 0;

  const cells =
    document.querySelectorAll(".cell");

  cells.forEach(cell => {

    cell.classList.remove("error");

  });


  for (let row = 0; row < 9; row++) {

    for (let col = 0; col < 9; col++) {

      if (board[row][col] === 0) {

        emptyCount++;

      } else if (
        board[row][col] !==
        solution[row][col]
      ) {

        wrongCount++;

        const cell =
          document.querySelector(
            `.cell[data-row="${row}"][data-col="${col}"]`
          );

        if (cell) {

          cell.classList.add("error");

        }

      }

    }

  }


  if (wrongCount > 0) {

    showMessage(
      `まだ違うマスがあります。${wrongCount}マス確認してください。`,
      "#c62828"
    );

    return;

  }


  if (emptyCount > 0) {

    showMessage(
      `あと${emptyCount}マスです。`,
      "#666"
    );

    return;

  }


  stopTimer();

  showMessage(
    `🎉 クリア！ おめでとうございます！ タイム ${timerElement.textContent}`,
    "#16803c",
    0
  );

}


/* =========================
   レベル変更
========================= */

function changeLevel() {

  currentLevel =
    difficultyElement.value;

  resetGame(false);

  showMessage(
    `${difficultyElement.options[difficultyElement.selectedIndex].text} の問題です。`,
    "#555"
  );

}


/* =========================
   リセット
========================= */

function resetGame(clearMessage = true) {

  stopTimer();

  board =
    puzzles[currentLevel]
      .map(row => [...row]);

  puzzle =
    puzzles[currentLevel]
      .map(row => [...row]);

  selectedCell = null;

  seconds = 0;

  gameStarted = false;

  timerElement.textContent =
    "00:00";

  if (clearMessage) {

    messageElement.textContent = "";

    messageElement.style.color = "";

  }

  createBoard();

}


/* =========================
   数字ボタン
========================= */

document
  .querySelectorAll(".number-btn")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const number =
          Number(button.dataset.number);

        inputNumber(number);

      }
    );

  });


/* =========================
   各種ボタン
========================= */

document
  .getElementById("checkBtn")
  .addEventListener(
    "click",
    checkAnswer
  );


document
  .getElementById("resetBtn")
  .addEventListener(
    "click",
    () => resetGame()
  );


difficultyElement
  .addEventListener(
    "change",
    changeLevel
  );


/* =========================
   初期表示
========================= */

createBoard();

</script>

</body>
</html>
