<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日のナンプレ 第1弾</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f6f6;color:#222;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{width:min(94vw,430px);margin:18px auto 28px}
h1{font-size:20px;text-align:center;margin:0 0 12px;font-weight:700}
.top{display:flex;gap:8px;margin-bottom:10px}
select,button{font:inherit}
select{flex:1;padding:9px;border:1px solid #bbb;border-radius:8px;background:#fff}
.timer{min-width:76px;text-align:center;padding:9px 6px;background:#fff;border:1px solid #bbb;border-radius:8px;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;background:#222;border:3px solid #222}
.cell{border:1px solid #aaa;background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vw,29px);font-weight:600;cursor:pointer;user-select:none}
.cell.fixed{background:#f0f0f0;cursor:default}
.cell.selected{background:#dcecff}
.cell.wrong{background:#ffd9d9;color:#c00}
.cell.br{border-right:3px solid #222}
.cell.bb{border-bottom:3px solid #222}
.numbers{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:10px}
.numbers button{height:42px;border:1px solid #aaa;border-radius:8px;background:#fff;font-size:18px;font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}
.actions button{height:42px;border:0;border-radius:8px;background:#333;color:#fff;font-weight:600}
.message{height:24px;text-align:center;margin-top:8px;font-size:14px;font-weight:600}
@media(max-width:360px){.wrap{width:96vw}.numbers{gap:4px}.actions{gap:5px}.cell{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
<h1>今日のナンプレ 第1弾</h1>
<div class="top">
<select id="level" aria-label="レベル">
<option value="beginner">初心者</option>
<option value="easy">初級</option>
<option value="medium">中級</option>
<option value="hard">上級</option>
</select>
<div class="timer" id="timer">00:00</div>
</div>
<div class="board" id="board"></div>
<div class="numbers" id="numbers"></div>
<div class="actions">
<button id="erase">消す</button>
<button id="check">答え合わせ</button>
<button id="reset">最初から</button>
</div>
<div class="message" id="message"></div>
</div>
<script>
const PUZZLES = {
  beginner: "163790540524136000700502006410387925008900460952061380241600800895214000637859200",
  easy:     "290804700040017932000030000410753620730000084060401357104302800689000073007698000",
  medium:   "500600000060039000349001726000903001000740089090000247056290013130006000000008000",
  hard:     "000800037400000020007091086000026700000000610002487000000740005000008000304002060"
};

const state = { level:"beginner", puzzle:[], solution:[], values:[], selected:-1, seconds:0, timerId:null, started:false };

function toGrid(s){ return Array.from({length:9},(_,r)=>Array.from({length:9},(_,c)=>+s[r*9+c])); }
function clone(g){ return g.map(r=>r.slice()); }

function solve(grid){
  const g=clone(grid), solutions=[];
  function candidates(r,c){
    const used=new Set(g[r]);
    for(let i=0;i<9;i++) used.add(g[i][c]);
    const br=Math.floor(r/3)*3, bc=Math.floor(c/3)*3;
    for(let rr=br;rr<br+3;rr++) for(let cc=bc;cc<bc+3;cc++) used.add(g[rr][cc]);
    const out=[]; for(let n=1;n<=9;n++) if(!used.has(n)) out.push(n);
    return out;
  }
  function dfs(){
    if(solutions.length>1)return;
    let best=null, opts=null;
    for(let r=0;r<9;r++) for(let c=0;c<9;c++) if(g[r][c]===0){
      const o=candidates(r,c); if(!o.length)return;
      if(!opts||o.length<opts.length){best=[r,c];opts=o;}
    }
    if(!opts){solutions.push(clone(g));return;}
    for(const n of opts){g[best[0]][best[1]]=n;dfs();g[best[0]][best[1]]=0;if(solutions.length>1)return;}
  }
  dfs();
  return solutions[0] || null;
}

function formatTime(sec){return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");}
function startTimer(){
  if(state.started)return;
  state.started=true;
  state.timerId=setInterval(()=>{state.seconds++;document.getElementById("timer").textContent=formatTime(state.seconds)},1000);
}
function stopTimer(){if(state.timerId){clearInterval(state.timerId);state.timerId=null;}}
function msg(text){
  const el=document.getElementById("message"); el.textContent=text;
  clearTimeout(msg.t); msg.t=setTimeout(()=>el.textContent="",1500);
}

function render(){
  const board=document.getElementById("board"); board.innerHTML="";
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){
    const i=r*9+c, el=document.createElement("div");
    el.className="cell";
    if(state.puzzle[r][c]) el.classList.add("fixed");
    if(c===2||c===5||c===8) el.classList.add("br");
    if(r===2||r===5||r===8) el.classList.add("bb");
    if(i===state.selected) el.classList.add("selected");
    const v=state.values[r][c]; el.textContent=v?v:"";
    el.onclick=()=>{ if(!state.puzzle[r][c]){state.selected=i;render();} };
    board.appendChild(el);
  }
}
function buildButtons(){
  const n=document.getElementById("numbers"); n.innerHTML="";
  for(let x=1;x<=9;x++){
    const b=document.createElement("button"); b.textContent=x;
    b.onclick=()=>inputNumber(x); n.appendChild(b);
  }
}
function inputNumber(n){
  if(state.selected<0)return;
  const r=Math.floor(state.selected/9),c=state.selected%9;
  if(state.puzzle[r][c])return;
  startTimer(); state.values[r][c]=n; render();
}
function erase(){
  if(state.selected<0)return;
  const r=Math.floor(state.selected/9),c=state.selected%9;
  if(state.puzzle[r][c])return;
  state.values[r][c]=0; render();
}
function check(){
  let complete=true, correct=true;
  document.querySelectorAll(".cell").forEach((el,i)=>el.classList.remove("wrong"));
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){
    if(!state.values[r][c]) complete=false;
    if(state.values[r][c] && state.values[r][c]!==state.solution[r][c]) correct=false;
  }
  if(complete && correct){
    stopTimer(); msg("クリア！");
  }else{
    document.querySelectorAll(".cell").forEach((el,i)=>{
      const r=Math.floor(i/9),c=i%9;
      if(!state.puzzle[r][c] && state.values[r][c] && state.values[r][c]!==state.solution[r][c]) el.classList.add("wrong");
    });
    msg("まだ完成していません");
  }
}
function reset(){
  stopTimer(); state.seconds=0;state.started=false;state.selected=-1;
  document.getElementById("timer").textContent="00:00";
  state.puzzle=toGrid(PUZZLES[state.level]); state.solution=solve(state.puzzle);
  state.values=clone(state.puzzle); render(); document.getElementById("message").textContent="";
}
document.getElementById("level").onchange=e=>{state.level=e.target.value;reset()};
document.getElementById("erase").onclick=erase;
document.getElementById("check").onclick=check;
document.getElementById("reset").onclick=reset;
buildButtons(); reset();
</script>
</body>
</html>
