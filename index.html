<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のナンプレ 第1弾 | ふぉーちゅん</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 10px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  background: #f7f7f7;
  color: #333;
}

.game-wrap {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 22px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h1 {
  margin: 0 0 8px;
  text-align: center;
  font-size: 25px;
  color: #333;
}

.subtitle {
  text-align: center;
  font-size: 14px;
  color: #777;
  margin-bottom: 18px;
}

.level-area {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

.level-btn {
  border: 1px solid #bbb;
  background: #fff;
  color: #333;
  border-radius: 6px;
  padding: 8px 13px;
  cursor: pointer;
  font-size: 13px;
}

.level-btn:hover {
  background: #f1f1f1;
}

.level-btn.active {
  background: #333;
  color: #fff;
  border-color: #333;
}

.info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #f4f6f7;
  border-radius: 7px;
  padding: 9px 12px;
  margin-bottom: 12px;
  font-size: 13px;
}

.message {
  min-height: 34px;
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  padding: 8px;
  margin-bottom: 8px;
  border-radius: 6px;
}

.message.error {
  background: #fff0f0;
  color: #d33;
}

.message.success {
  background: #effaf0;
  color: #268a35;
}

.message:empty {
  background: transparent;
}

.sudoku {
  width: min(100%, 450px);
  aspect-ratio: 1 / 1;
  margin: 0 auto 16px;
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  border: 3px solid #333;
  background: #333;
  gap: 0;
}

.cell {
  position: relative;
  background: #fff;
  border-right: 1px solid #aaa;
  border-bottom: 1px solid #aaa;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: clamp(18px, 5vw, 29px);
  font-weight: 500;
  user-select: none;
}

.cell:nth-child(3n) {
  border-right: 2px solid #333;
}

.cell:nth-child(9n) {
  border-right: none;
}

.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
  border-bottom: 2px solid #333;
}

.cell:nth-child(n+73) {
  border-bottom: none;
}

.cell.fixed {
  background: #f0f0f0;
  font-weight: 700;
  color: #222;
  cursor: default;
}

.cell.selected {
  background: #eaf4ff;
}

.cell.related {
  background: #f7fbff;
}

.cell.same-number {
  background: #e4f0ff;
}

.cell.wrong {
  animation: shake 0.25s;
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.number-pad {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 5px;
  margin: 0 auto 12px;
  width: min(100%, 450px);
}

.number-btn {
  border: 1px solid #aaa;
  background: #fff;
  border-radius: 5px;
  padding: 10px 3px;
  font-size: 17px;
  cursor: pointer;
}

.number-btn:hover {
  background: #f1f1f1;
}

.number-btn:active {
  transform: scale(0.96);
}

.control-area {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 8px;
}

.control-btn {
  border: 1px solid #888;
  background: #fff;
  border-radius: 6px;
  padding: 9px 16px;
  cursor: pointer;
  font-size: 13px;
}

.control-btn.main {
  background: #333;
  color: #fff;
  border-color: #333;
}

.note {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin-top: 15px;
  line-height: 1.7;
}

.clear-box {
  display: none;
  margin-top: 15px;
  padding: 15px;
  background: #f0faf1;
  border: 1px solid #b8dfbc;
  border-radius: 8px;
  text-align: center;
}

.clear-box.show {
  display: block;
}

.clear-title {
  font-size: 20px;
  font-weight: bold;
  color: #258334;
  margin-bottom: 5px;
}

@media (max-width: 480px) {
  body {
    padding: 10px 5px;
  }

  .game-wrap {
    padding: 15px 10px;
  }

  h1 {
    font-size: 21px;
  }

  .level-btn {
    padding: 7px 9px;
    font-size: 12px;
  }

  .number-btn {
    padding: 9px 2px;
    font-size: 15px;
  }
}
</style>
</head>

<body>

<div class="game-wrap">

  <h1>🧩 今日のナンプレ 第1弾</h1>

  <div class="subtitle">
    ちょっとした待ち時間・手すき時間にどうぞ
  </div>

  <div class="level-area">
    <button class="level-btn active" data-level="beginner">🌱 初心者</button>
    <button class="level-btn" data-level="easy">🔰 初級</button>
    <button class="level-btn" data-level="medium">🧠 中級</button>
    <button class="level-btn" data-level="hard">🔥 上級</button>
  </div>

  <div class="info">
    <span id="levelName">初心者</span>
    <span>⏱ <span id="timer">00:00</span></span>
  </div>

  <div id="message" class="message"></div>

  <div id="sudoku" class="sudoku"></div>

  <div id="numberPad" class="number-pad">
    <button class="number-btn" data-number="1">1</button>
    <button class="number-btn" data-number="2">2</button>
    <button class="number-btn" data-number="3">3</button>
    <button class="number-btn" data-number="4">4</button>
    <button class="number-btn" data-number="5">5</button>
    <button class="number-btn" data-number="6">6</button>
    <button class="number-btn" data-number="7">7</button>
    <button class="number-btn" data-number="8">8</button>
    <button class="number-btn" data-number="9">9</button>
  </div>

  <div class="control-area">
    <button id="eraseBtn" class="control-btn">消す</button>
    <button id="resetBtn" class="control-btn">リセット</button>
  </div>

  <div id="clearBox" class="clear-box">
    <div class="clear-title">🎉 クリア！</div>
    <div>おめでとうございます！</div>
    <div id="clearTime"></div>
  </div>

  <div class="note">
    マスを選んで数字を入力してください。<br>
    間違った数字を入れると、メッセージが少しだけ表示されます。<br>
    リセットしても、同じ問題に戻ります。
  </div>

</div>

<script>
/* =========================================
   今日のナンプレ 第1弾
   ========================================= */

/*
   全レベル共通の正解盤面
*/
const solution = [
  [5,3,4,6,7,8,9,1,2],
  [6,7,2,1,9,5,3,4,8],
  [1,9,8,3,4,2,5,6,7],
  [8,5,9,7,6,1,4,2,3],
  [4,2,6,8,5,3,7,9,1],
  [7,1,3,9,2,4,8,5,6],
  [9,6,1,5,3,7,2,8,4],
  [2,8,7,4,1,9,6,3,5],
  [3,4,5,2,8,6,1,7,9]
];

/*
   0 = 空欄
   初心者はかなり易しめにしています。
*/
const puzzles = {

  beginner: [
    [5,3,4,6,7,8,9,1,0],
    [6,7,2,1,9,5,3,0,8],
    [1,9,8,3,4,2,0,6,7],
    [8,5,9,7,6,0,4,2,3],
    [4,2,6,8,5,3,7,9,0],
    [7,1,3,9,0,4,8,5,6],
    [9,6,1,5,3,7,2,0,4],
    [2,8,7,4,1,9,0,3,5],
    [3,4,5,2,8,0,1,7,9]
  ],

  easy: [
    [5,3,0,6,7,0,9,1,2],
    [6,0,2,1,9,5,3,4,0],
    [1,9,8,0,4,2,5,6,7],
    [8,5,9,7,0,1,4,2,3],
    [4,2,6,8,5,3,0,9,1],
    [7,1,3,0,2,4,8,5,6],
    [9,6,1,5,3,7,2,8,0],
    [2,8,7,4,1,0,6,3,5],
    [0,4,5,2,8,6,1,7,9]
  ],

  medium: [
    [5,3,0,6,7,0,9,0,2],
    [6,0,2,1,9,5,0,4,0],
    [1,9,8,0,4,2,5,0,7],
    [8,0,9,7,0,1,4,2,0],
    [4,2,0,8,5,3,0,9,1],
    [7,1,3,0,2,0,8,0,6],
    [9,0,1,5,0,7,2,8,4],
    [0,8,7,4,1,9,0,3,5],
    [3,4,0,2,8,6,1,0,9]
  ],

  hard: [
    [0,3,0,6,0,8,9,0,2],
    [6,0,2,0,9,0,0,4,0],
    [0,9,8,3,0,2,0,6,0],
    [8,0,0,7,6,0,4,0,3],
    [0,2,6,0,5,3,0,9,0],
    [7,0,3,9,0,0,8,0,6],
    [9,0,0,5,3,7,0,8,0],
    [0,8,7,0,1,0,6,0,5],
    [3,0,5,2,0,6,0,7,9]
  ]
};

const levelNames = {
  beginner: "初心者",
  easy: "初級",
  medium: "中級",
  hard: "上級"
};

let currentLevel = "beginner";
let board = [];
let selectedCell = null;
let timerSeconds = 0;
let timerInterval = null;
let gameStarted = false;
let messageTimer = null;

const sudoku = document.getElementById("sudoku");
const message = document.getElementById("message");
const timer = document.getElementById("timer");
const levelName = document.getElementById("levelName");
const clearBox = document.getElementById("clearBox");
const clearTime = document.getElementById("clearTime");


/* -----------------------------------------
   ゲーム開始
----------------------------------------- */

function startGame() {

  clearInterval(timerInterval);

  board = puzzles[currentLevel].map(row => [...row]);

  selectedCell = null;
  timerSeconds = 0;
  gameStarted = false;

  updateTimer();

  clearBox.classList.remove("show");
  clearMessage();

  renderBoard();
}


/* -----------------------------------------
   盤面表示
----------------------------------------- */

function renderBoard() {

  sudoku.innerHTML = "";

  for (let r = 0; r < 9; r++) {

    for (let c = 0; c < 9; c++) {

      const cell = document.createElement("div");

      cell.className = "cell";
      cell.dataset.row = r;
      cell.dataset.col = c;

      const value = board[r][c];

      if (value !== 0) {
        cell.textContent = value;
      }

      if (puzzles[currentLevel][r][c] !== 0) {
        cell.classList.add("fixed");
      }

      cell.addEventListener("click", () => {

        if (puzzles[currentLevel][r][c] !== 0) {
          return;
        }

        selectedCell = { r, c };

        if (!gameStarted) {
          startTimer();
        }

        highlightCells();
      });

      sudoku.appendChild(cell);
    }
  }

  highlightCells();
}


/* -----------------------------------------
   選択セルの強調
----------------------------------------- */

function highlightCells() {

  const cells = document.querySelectorAll(".cell");

  cells.forEach(cell => {
    cell.classList.remove("selected");
    cell.classList.remove("related");
    cell.classList.remove("same-number");
  });

  if (!selectedCell) {
    return;
  }

  const { r, c } = selectedCell;

  cells.forEach(cell => {

    const cr = Number(cell.dataset.row);
    const cc = Number(cell.dataset.col);

    if (cr === r && cc === c) {
      cell.classList.add("selected");
    }

    if (cr === r || cc === c ||
        (Math.floor(cr / 3) === Math.floor(r / 3) &&
         Math.floor(cc / 3) === Math.floor(c / 3))) {

      cell.classList.add("related");
    }

    if (
      board[r][c] !== 0 &&
      board[cr][cc] === board[r][c]
    ) {
      cell.classList.add("same-number");
    }

  });

}


/* -----------------------------------------
   数字入力
----------------------------------------- */

function enterNumber(number) {

  if (!selectedCell) {
    showMessage("まず入力したいマスを選んでください。", "error");
    return;
  }

  const r = selectedCell.r;
  const c = selectedCell.c;

  if (puzzles[currentLevel][r][c] !== 0) {
    return;
  }

  if (!gameStarted) {
    startTimer();
  }

  /* 正解 */
  if (solution[r][c] === number) {

    board[r][c] = number;

    renderBoard();

    if (checkComplete()) {
      finishGame();
    }

  } else {

    const cells = document.querySelectorAll(".cell");
    const index = r * 9 + c;

    cells[index].classList.add("wrong");

    showMessage("その数字ではありません。", "error");

    setTimeout(() => {
      cells[index]?.classList.remove("wrong");
    }, 300);

  }

}


/* -----------------------------------------
   消す
----------------------------------------- */

function eraseNumber() {

  if (!selectedCell) {
    return;
  }

  const r = selectedCell.r;
  const c = selectedCell.c;

  if (puzzles[currentLevel][r][c] !== 0) {
    return;
  }

  board[r][c] = 0;

  renderBoard();
}


/* -----------------------------------------
   完成判定
----------------------------------------- */

function checkComplete() {

  for (let r = 0; r < 9; r++) {

    for (let c = 0; c < 9; c++) {

      if (board[r][c] !== solution[r][c]) {
        return false;
      }

    }

  }

  return true;
}


/* -----------------------------------------
   クリア
----------------------------------------- */

function finishGame() {

  clearInterval(timerInterval);

  gameStarted = false;

  clearTime.textContent =
    "クリアタイム：" + formatTime(timerSeconds);

  clearBox.classList.add("show");

  showMessage(
    "おめでとうございます！ナンプレ完成です！",
    "success"
  );
}


/* -----------------------------------------
   タイマー
----------------------------------------- */

function startTimer() {

  if (gameStarted) {
    return;
  }

  gameStarted = true;

  timerInterval = setInterval(() => {

    timerSeconds++;

    updateTimer();

  }, 1000);

}


function updateTimer() {

  timer.textContent = formatTime(timerSeconds);

}


function formatTime(seconds) {

  const min = Math.floor(seconds / 60);
  const sec = seconds % 60;

  return String(min).padStart(2, "0") +
         ":" +
         String(sec).padStart(2, "0");
}


/* -----------------------------------------
   メッセージ
----------------------------------------- */

function showMessage(text, type) {

  clearTimeout(messageTimer);

  message.textContent = text;
  message.className = "message " + type;

  messageTimer = setTimeout(() => {

    clearMessage();

  }, 1500);

}


function clearMessage() {

  message.textContent = "";
  message.className = "message";

}


/* -----------------------------------------
   レベル変更
----------------------------------------- */

document.querySelectorAll(".level-btn").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".level-btn")
      .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    currentLevel = button.dataset.level;

    levelName.textContent = levelNames[currentLevel];

    startGame();

  });

});


/* -----------------------------------------
   数字ボタン
----------------------------------------- */

document.querySelectorAll(".number-btn").forEach(button => {

  button.addEventListener("click", () => {

    const number = Number(button.dataset.number);

    enterNumber(number);

  });

});


/* -----------------------------------------
   消すボタン
----------------------------------------- */

document.getElementById("eraseBtn")
  .addEventListener("click", eraseNumber);


/* -----------------------------------------
   リセット
----------------------------------------- */

document.getElementById("resetBtn")
  .addEventListener("click", () => {

    startGame();

  });


/* -----------------------------------------
   キーボード入力
----------------------------------------- */

document.addEventListener("keydown", event => {

  if (event.key >= "1" && event.key <= "9") {

    enterNumber(Number(event.key));

  }

  if (
    event.key === "Backspace" ||
    event.key === "Delete" ||
    event.key === "0"
  ) {

    eraseNumber();

  }

});


/* -----------------------------------------
   初期表示
----------------------------------------- */

startGame();

</script>

</body>
</html>
